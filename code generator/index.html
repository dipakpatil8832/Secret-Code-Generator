<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Code Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🔐 Secret Code Generator</h1>
  <div class="container">
    
    <textarea id="message" placeholder="Enter your message..."></textarea>

    <div class="controls">
      <label for="shift">Shift value:</label>
      <input type="number" id="shift" value="3" />
    </div>

    <div class="buttons">
      <button onclick="encodeMessage()">Encode</button>
      <button onclick="decodeMessage()">Decode</button>
      <button onclick="clearAll()">Clear</button>
    </div>

    <h3>Result:</h3>
    <div id="output"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
